[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phlag-avian-simulations"
version = "0.1.0"
description = "Simulating phylogenetic anomalies to benchmark phlag"
readme = "README.md"
requires-python = "==3.9.*"
authors = [
    { name = "Isaac Ang" },
]
keywords = ["phylogenetics", "genomics", "HMM", "coalescent", "gene-trees"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "tskit==0.6.4",
    "dendropy==5.0.10",
    "msprime==1.3.4",
    "treeswift==1.1.45",
    "daiquiri==3.2.5.1"
]

[project.urls]
Homepage = "https://github.com/isaacangyu/phlag-avian-simulations"
Repository = "https://github.com/isaacangyu/phlag-avian-simulations"

[project.scripts]
simulate = "scripts.simulate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]